name: Discord

# Posts crafted cards for repo events to the repo's Discord channel: per-event
# colors, author avatars, +/- line counts, link buttons, compact one-liners,
# and a checks line when CI finishes on a PR. Formatting lives in
# scripts/discord-card.mjs. The channel's webhook URL is the DISCORD_WEBHOOK
# repository secret (a plain webhook URL, no /github suffix).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, closed]
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]
  release:
    types: [published]
  workflow_run:
    types: [completed]

permissions:
  contents: read

jobs:
  card:
    name: Post to Discord
    # Never react to our own completed runs (loop guard).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Discord'
    runs-on: ubuntu-latest
    steps:
      # workflow_run.head_sha can be from a branch that predates this workflow,
      # so always format cards with the default branch's script.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - name: Post the card
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # Only used to read commit line counts; public repos work without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discord-card.mjs
